<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Prototype</title>
    <style>
        /* ==========================================================================
           1. Global Reset & Typography Baseline
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html {
            font-size: 75%; /* Scales the root font size to 75% */
        }
        body {
            background-color: #ffffff;
            color: #111111;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           2. Navigation Header Bar Layout
           ========================================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: #ffffff;
            z-index: 1000;
            border-bottom: 2px solid #111111;
        }
        .logo {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #111111;
            text-decoration: none;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }
        nav a {
            text-decoration: none;
            color: #666666;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        nav a:hover, nav a.active {
            color: #000000;
            border-bottom: 2px solid #000000;
        }

        /* ==========================================================================
           3. Core Content Page Viewports
           ========================================================================== */
        .page {
            display: none; /* Hidden by default */
            padding: 110px 60px 60px 60px;
            min-height: 100vh;
            max-width: 1700px;
            margin: 0 auto;
        }
        .page:target, .page.default-view {
            display: block;
        }
        body:has(.page:target:not(#home)) .page.default-view {
            display: none;
        }

        /* ==========================================================================
           4. Fluid Home Tab Split Screen Layout (No Gaps or Text Overlaps)
           ========================================================================== */
        .page.full-width-override {
            padding: 0 !important; /* Pulls home content edge-to-edge flush with taskbar */
            max-width: none;
            margin: 0;
            width: 100vw;
            height: calc(100vh - 80px); 
            overflow: hidden;
            display: flex;       
        }
        .home-split-container {
            display: flex;
            flex-wrap: wrap; /* Secret: forces clean vertical column fold on small viewports */
            width: 100%;
            min-height: 100%;
            margin: 0 !important;          
            padding: 0 !important;         
        }

        /* Left Side: Immersive Graphics Canvas Frame */
        .home-left-hero {
            flex: 1 1 65%;
            min-height: calc(100vh - 80px); 
            background-size: cover;
            background-position: center;
            display: flex !important;
            align-items: flex-end !important;   /* Anchors text tightly to bottom-left quadrant */
            justify-content: flex-start !important; 
            padding: 60px !important;            
            position: relative;
            box-sizing: border-box;
        }
        .home-left-hero h1,
        .home-center-header,
        .hero-main-title,
        .hero-sub-tags {
            color: #ffffff !important; /* Locks hero titles into clean high-contrast white profile */
            text-align: left !important;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8) !important;
        }
        .home-center-header .hero-sub-tags {
            opacity: 0.9;
        }
        .hero-main-title {
            font-size: clamp(2.5rem, 5vw, 5rem); /* Responsive fluid typography scaling */
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 12px;
        }
        .hero-sub-tags {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem); 
            font-weight: 400;
        }

        /* Right Side: Symmetrical Grey Biography Box Column */
        .home-right-profile {
            flex: 1 1 35%;
            background-color: #26292e;
            color: #ffffff;
            padding: 40px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;     
            justify-content: center !important; /* Perfect desktop horizontal/vertical centering balance */
            box-sizing: border-box !important;
        }
        .profile-inner-content {
            width: 100% !important;
            max-width: 380px !important;
            margin: 0 auto !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;     
        }
        .profile-avatar-container {
            display: flex !important;
            justify-content: center !important; 
            align-items: center !important;
            width: 100% !important;
            margin: 0 auto 25px auto !important;
        }
        .home-right-profile img,
        .profile-img {
            width: 160px !important; /* Compacted profile footprint layout size */
            height: auto !important;       
            max-width: 85% !important;     
            border-radius: 8px !important; 
            border: 1px solid #e0e0e0 !important; 
            display: block !important;
            margin: 0 auto !important;          
            margin-bottom: 30px !important; 
        }
        .profile-heading {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center !important;
        }
        .profile-bio-text {
            font-size: 1rem;
            line-height: 1.65;
            color: #ffffff; 
            text-align: left !important;        
            width: 100%;
        }

        /* Strips default browser margins to fully eliminate the home container top white gaps */
        #home h1, #home h2, #home p, #home .home-center-header, #home .profile-inner-content {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* ==========================================================================
           5. Portfolio Main Dashboard Grid System (2 Per Row)
           ========================================================================== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 50px;
            margin-top: 40px;
        }
        .project-card {
            display: flex;
            flex-direction: column;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            background: #ffffff;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .project-card:hover {
            border-color: #000000;
            transform: translateY(-2px);
        }
        .project-card-media {
            width: 100%;
            height: 380px; 
            overflow: hidden;
        }
        .project-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .project-card-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .project-card-info h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111111; 
            margin-bottom: 10px;
        }
        .project-card-summary {
            font-size: 0.95rem;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 25px;
            flex-grow: 1;
        }
        .view-details-btn {
            display: inline-block;
            text-align: center;
            background: #000000;
            color: #ffffff !important; 
            text-decoration: none !important; 
            padding: 12px 24px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            transition: background 0.2s ease;
        }
        .view-details-btn:hover {
            background: #333333;
        }

        /* ==========================================================================
           6. Horizontal Scrolling Resume Tracking Sheet Components
           ========================================================================== */
        .scroll-hint-text {
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888888; 
            margin-bottom: 15px; 
            width: 100%;
        }
        .resume-scroll-row {
            display: flex;
            flex-direction: row;
            gap: 40px;
            overflow-x: auto;
            padding-bottom: 20px;
            width: 100%;
            scroll-snap-type: x mandatory;
        }
        .resume-scroll-row img {
            width: 100%;
            max-width: 620px;
            height: auto;
            flex-shrink: 0;
            scroll-snap-align: start;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: border-color 0.2s ease;
        }
        .resume-scroll-row img:hover {
            border-color: #000000;
        }
        .resume-picture {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
        /* ==========================================================================
        7. Engineering Case Study Details View (Zoomed-In 15% Readability Mode)
        ========================================================================== */
        section[id^="project-"] {
            font-size: 1.15rem;
        }
        .back-btn {
            display: inline-block;
            background: #000000;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .back-btn:hover {
            background: #333333;
        }
        .detail-layout {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1800px;
            margin: 0;
        }
        .detail-text h2 {
            font-size: 2.3rem;
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.1;
                }
        .detail-text h3 {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #111111;
        }
        .detail-text p {
            color: #444444;
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .side-by-side-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 25px;
            width: 100%;
        }
        .side-by-side-row img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #e0e0e0;
            transition: border-color 0.2s ease;
        }
        .side-by-side-row img:hover {
            border-color: #000000;
        }
        .detail-gallery {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 20px;
        }
        .detail-gallery img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            border: 1px solid #e0e0e0;
            transition: border-color 0.2s ease;
        }
        .detail-gallery img:hover {
            border-color: #000000;
        }
        .portfolio-video {
            width: 100%;
            height: auto;
            border-radius: 4px;
            object-fit: cover;
            background-color: #000000;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        .report-button-container {
            margin-top: 50px;
            margin-bottom: 20px;
            width: 100%;
        }
        .report-action-btn {
            display: inline-block;
            background: #000000;
            color: #ffffff !important;
            text-decoration: none !important;
            padding: 16px 32px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .report-action-btn:hover {
            background: #333333;
            transform: translateY(-1px);
        }
        /* ==========================================================================
        8. Contact Input Fields & Social Media Icons
        ========================================================================== */
        h2.section-title {
            font-size: 2.8rem;
            font-weight: 500;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        #contact .section-title {
            border-bottom: none;
            padding-bottom: 0;
        }
        .text-block {
            max-width: 700px;
            font-size: 1.1rem;
            color: #333333;
        }
        form {
            max-width: 600px;
            margin-top: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #cccccc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:hover, textarea:hover {
            border-color: #888888;
        }
        input:focus, textarea:focus {
            border-color: #000000;
        }
        .submit-btn {
            background: #000000;
            color: #ffffff;
            padding: 14px 32px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: background 0.2s ease;
        }
        .submit-btn:hover {
            background: #333333;
        }
        .contact-details-footer {
            margin-top: 40px;
            max-width: 600px;
            font-size: 1.05rem;
            color: #333333;
        }
        .contact-details-footer p {
            margin-bottom: 10px;
        }
        .social-circles-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        .social-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: all 0.2s ease;
        }
        .social-circle svg {
            width: 20px;
            height: 20px;
            fill: #111111;
            transition: fill 0.2s ease;
        }
        .social-circle:hover {
            background: #111111;
        }
        .social-circle:hover svg {
            fill: #ffffff;
        }
        /* ==========================================================================
        9. High-Priority Unified Mobile Responsive Overrides
        ========================================================================== */
        @media (max-width: 1024px) {
            header {
                flex-direction: column !important;
                padding: 15px 20px !important;
                gap: 10px !important;
                height: auto !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                background: #ffffff !important;
            }
            nav {
                gap: 15px !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                width: 100% !important;
            }
            .page {
                padding-top: 150px !important;
                padding-left: 20px !important;
                padding-right: 20px !important;
            }
            .page.full-width-override {
                padding-top: 130px !important;
                height: auto !important;
                width: 100vw !important;
                display: block !important;
            }
            .home-split-container {
                flex-direction: column !important;
                height: auto !important;
            }
            .home-left-hero {
                width: 100% !important;
                min-height: 380px !important;
                height: 380px !important;
                padding: 30px !important;
            }
            .home-right-profile {
                width: 100% !important;
                height: auto !important;
                padding: 50px 30px !important;
            }
                .profile-inner-content {
                max-width: 100% !important;
            }
            .detail-layout {
                gap: 30px !important;
            }
        }

        @media (max-width: 900px) {
            .projects-grid {
            grid-template-columns: 1fr !important;
            gap: 30px !important;
            }
            .project-card-media {
            height: 280px !important;
            }
        }
        @media (max-width: 600px) {
            .side-by-side-row {
                grid-template-columns: 1fr !important;
                gap: 15px !important;
            }
        }
    </style>

<!-- 🟢 THIS SCRIPT WRAPPER KEEPS YOUR EDITOR HAPPY AND RUNS THE NAV LINKS -->
        <script>
            function updateActiveNavState() {
                const currentHash = window.location.hash || '#home';
                const pages = document.querySelectorAll('.page');
                const navLinks = document.querySelectorAll('#navbar a');
                
                pages.forEach(function(page) {
                    const targetId = '#' + page.id;
                    if (currentHash === targetId || (currentHash.startsWith('#project-') && targetId === '#portfolio')) {
                        page.style.display = 'block';
                    } else {
                        page.style.display = 'none';
                    }
                    if (currentHash === targetId) {
                        window.scrollTo(0, 0);
                    }
                });

                navLinks.forEach(function(link) {
                    const targetHash = link.getAttribute('href');
                    if (currentHash === targetHash || (targetHash === '#portfolio' && currentHash.startsWith('#project-'))) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            }

            window.addEventListener('hashchange', updateActiveNavState);
            window.addEventListener('load', updateActiveNavState);
        </script>
</head>
</html>
